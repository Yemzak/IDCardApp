<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDOHIC IDCARD PORTAL</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Safe stubs for inline onclicks so missing scripts don't cause ReferenceError on click -->
    <script>
        (function () {
            const stub = function () { try { if (typeof showToast === 'function') showToast('App is still loading, please wait...', true); else console.warn('App not ready'); } catch (e) { } };
            window.generateIDCard = window.generateIDCard || stub;
            window.downloadIDCard = window.downloadIDCard || stub;
            window.printIDCard = window.printIDCard || stub;
            window.searchEnrollee = window.searchEnrollee || stub;
            window.searchDependents = window.searchDependents || stub;
            window.printAllDependents = window.printAllDependents || stub;
        })();
    </script>

    <!-- Required Libraries -->
    <script src="qrcode.min.js"></script>
    <script src="xlsx.full.min.js"></script> <!-- Excel Handling -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script> <!-- JSZip for ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- FileSaver.js for ZIP Download -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>
    <header class="app-header">
        <div class="logo"><img src="logo.png" alt="EDHIC Logo"></div>
        <div class="title">
            <h1>EDOHIC ID-CARD PORTAL</h1>
        </div>
        <div id="supabaseStatus" class="status">Supabase: Checking...</div>
        </header>

    <div id="message" style="color: red; font-weight: bold; text-align: center; margin: 10px 0;"></div>

    <div class="container">
        <div class="form-container">
            <h2>Single ID Generation</h2>
            <form id="idForm" class="id-form">
                <div class="form-section">
                    <label for="cin">CIN</label>
                    <div class="row">
                        <input type="text" id="cin" placeholder="Enter CIN" required aria-label="CIN">
                        <button type="button" id="searchBtn" class="btn-secondary">Search</button>
                    </div>
                </div>

                <hr>

                <div class="form-section">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter full name" required aria-label="Name">
                
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" required aria-label="Date of birth">

                    <label for="bloodGroup">Blood Group</label>
                    <input type="text" id="bloodGroup" placeholder="e.g. O+" required aria-label="Blood group">
                    </div>

                <div class="form-section">
                    <label for="photo">Photo</label>
                    <input type="file" id="photo" accept="image/*" aria-label="Upload photo">
                    <img id="photoPreview" class="photo-preview" alt="Photo preview">
                </div>

                <div class="form-section dates">
                    <label for="issDate">Issuance Date</label>
                    <input type="date" id="issDate" placeholder="Issuance Date" aria-label="Issuance date">

                    <label for="expDate">Expiry Date</label>
                    <input type="date" id="expDate" placeholder="Expiry Date" aria-label="Expiry date">
                    <div id="expHint" class="field-hint" aria-live="polite">Expiry not used for FOP IDs</div>
                    </div>

                <div class="form-actions">
                    <button type="button" id="generateBtn" class="btn-primary">Generate ID Card</button>
                </div>
            </form>
        </div>

        <div class="preview-panel" aria-label="Card preview">
            <canvas id="idCardCanvas" width="600" height="400"></canvas>
            <div class="preview-actions">
                <button type="button" id="downloadBtn">Download</button>
                <button type="button" id="printBtn">Print</button>
            </div>
            </div>
    </div>

    <!-- ================= Dependent ID Card Printing Section ================= -->
    <div class="container" style="margin-top:40px;">
        <div class="form-container">
            <h2>Dependent ID Card Printing</h2>
            <label for="principalSearch">Principal CIN or Phone:</label>
            <input type="text" id="principalSearch" placeholder="Enter Principal CIN or Phone">
            <button type="button" id="searchDependentsBtn">Search Dependents</button>
            <div id="dependentsSection" style="display:none; margin-top:20px;">
                <div id="dependentsGrid"
                    style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;"></div>
                <button id="printAllDependentsBtn" type="button" style="display:none;margin-top:18px;">Download All Dependents</button>
                <canvas id="dependentIdCardCanvas" width="600" height="400" style="display:none;"></canvas>
            </div>
        </div>
    </div>
    <div id="toast"></div>
    <script src="script.js"></script>
    <script>
    // Toast/alert logic for professional error/info display
    function showToast(message, isError = true) {
        var toast = document.getElementById('toast');
        if (!toast) return;
        toast.className = 'show' + (isError ? '' : ' success');
        toast.textContent = message;
        setTimeout(function(){ toast.className = toast.className.replace('show', ''); }, 4000);
    }
    // Patch displayMessage to use toast
    if (typeof displayMessage === 'function') {
        window.displayMessage = function(message, isError = true) {
            var messageDiv = document.getElementById('message');
            if (messageDiv) {
                messageDiv.style.color = isError ? '#d32f2f' : '#43a047';
                messageDiv.textContent = message;
                setTimeout(() => { messageDiv.textContent = ''; }, 5000);
            }
            showToast(message, isError);
        }
    } else {
        window.displayMessage = showToast;
    }
    </script>
    <!-- Live preview for photos handled in script.js for maintainability -->
</body>

</html>
